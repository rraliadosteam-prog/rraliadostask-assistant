name: release

# Builds the desktop artifacts for the platforms RR supports and attaches them to a
# GitHub release, so anyone can download the app without a build step.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: rr-tareas-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rr-tareas-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rr-tareas-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve the Rust lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Typecheck and test
        run: pnpm check

      - name: Build the desktop app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp --parents {} out/ \;
          find out -type f -print0 | xargs -0 sha256sum > out/SHA256SUMS.txt
          ls -R out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            RR Tareas, asistente flotante local de tareas y notas.

            Cada artefacto viene con `SHA256SUMS.txt`. El proyecto es local: no requiere cuenta, red ni secretos.
          files: artifacts/**/*
          fail_on_unmatched_files: true
